 # Work flow name - This is the name of the workflow that will be displayed in the Actions Tab
 name: CICD
# Manual click (deliver) workflow whenever user needs
 on: 
   workflow_dispatch:
    inputs:
      environment:
       description: This is environment value where workflow runs
       default: 'dev'
       required: true
       type: choice
       options:
         - dev
         - prod
         - staging

 jobs:
   code:
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         run: echo "code done from Github"
   build:
     needs: [code]
     runs-on: ubuntu-latest
     steps:
       - name: Build Docker Container
         run: echo "Docker container build"
   test:
     needs: [build]
     runs-on: ubuntu-latest
     steps:
       - name: Test the container
         run: echo "Testing the container"
   deploy:
     needs: [build,test]
     runs-on: ubuntu-latest
     steps:
       - name: Deploying the App
         run : echo "Docker compose deployed the App"
